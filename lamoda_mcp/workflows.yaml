# Бизнес-рецепты: какие методы вызвать и что посчитать.
#
# Каждый шаг ссылается на реальный operation_id из endpoints.yaml. Тест
# test_workflows.py следит, чтобы ссылки существовали, были чтением и не
# указывали на служебные методы Lamoda.
#
# Формулы намеренно простые и проверяемые. Поля ответов Lamoda боем не
# подтверждены (каталог собран из спеки), поэтому в каждом рецепте есть шаг
# «посмотреть фактическую форму ответа» — не считайте вслепую.

workflows:

  stock_coverage:
    title: "Покрытие остатков"
    question: "На сколько дней хватит текущих остатков?"
    steps:
      - method: v1.stocks.summary
        purpose: "Сводка по остаткам продавца — отправная точка."
      - method: v2.stock.list
        purpose: "Остатки по позициям."
        note: "Постранично, используйте lamoda_fetch_all."
      - method: v1.orders.list
        purpose: "Заказы за период, чтобы получить темп продаж."
        note: "Задайте окно в 28 дней — оно сглаживает недельную сезонность."
    formula: |
      Средние продажи в день (ADS) = продано за период / дней в периоде
      Дней покрытия = доступный остаток / ADS
    cautions:
      - "Считайте только СВОБОДНЫЙ остаток. Товар в резерве, в пути и на приёмке
         покрытием не является — в marketplace-mcp это была типовая ошибка,
         когда inWay и quantityFull ошибочно принимали за доступный запас."
      - "ADS по позиции с 1-2 продажами за месяц статистически бессмысленна:
         такие позиции разбирайте отдельно, а не формулой."
      - "Сначала посмотрите фактические имена полей в ответе: назначение поля
         в спеке и в живом ответе может расходиться."

  illiquid_stock:
    title: "Неликвид"
    question: "Что лежит мёртвым грузом и занимает место?"
    steps:
      - method: v1.stocks-illiquid.list
        purpose: "Позиции, отнесённые Lamoda к неликвиду."
      - method: v1.stock-illiquid-report.download
        purpose: "Выгрузка отчёта по неликвиду, если нужен файл."
    formula: |
      Замороженные деньги = остаток × закупочная цена
      Сортируйте по этой величине: сверху то, что дороже всего простаивает.
    cautions:
      - "Критерий неликвида задаёт Lamoda — он может не совпадать с вашим."

  orders_funnel:
    title: "Воронка заказов"
    question: "Где заказы застревают?"
    steps:
      - method: v1.order-statuses.list
        purpose: "Справочник статусов — нужен, чтобы расшифровать коды."
      - method: v1.orders-count-by-statuses.get
        purpose: "Сколько заказов в каждом статусе прямо сейчас."
      - method: v1.orders.list
        purpose: "Детализация по проблемному статусу."
    formula: |
      Доля статуса = заказов в статусе / всего заказов
      Смотрите на аномально раздутые промежуточные статусы — это узкое место.
    cautions:
      - "Снимок по статусам — это «сейчас», а не динамика. Один замер ничего
         не говорит о тренде; сравнивайте с предыдущим."

  returns_pulse:
    title: "Пульс возвратов"
    question: "Сколько возвращают и почему?"
    steps:
      - method: v1.supplier-return.statistics.get
        purpose: "Статистика возвратов поставщику."
      - method: v1.seller-return-fbs.statistics.get
        purpose: "Статистика возвратов по схеме FBS."
      - method: v1.supplier-return.list
        purpose: "Список возвратов для разбора причин."
        note: "Постранично."
    formula: |
      Доля возвратов = возвращено штук / продано штук за тот же период
    cautions:
      - "В одежде и обуви высокий процент возвратов — норма, а не поломка.
         Смысл имеет сравнение позиции со средним по вашей же категории,
         а не с абсолютным порогом."
      - "Возврат и продажа попадают в разные периоды: возвращают то, что
         куплено недели назад. Не делите возвраты этой недели на продажи
         этой же недели."

  price_index_watch:
    title: "Ценовой индекс"
    question: "Как мои цены выглядят на фоне рынка?"
    steps:
      - method: v1.matching-manager.price-index.total.get
        purpose: "Сводное значение ценового индекса."
      - method: v1.matching-manager.price-index.products.list
        purpose: "Разбивка по товарам — где именно отклонение."
        note: "Постранично."
      - method: v1.matching-manager.price-index.settings.get
        purpose: "Текущие настройки индекса — по каким правилам он считается."
    formula: |
      Индекс сравнивает вашу цену с ценами конкурентов на ту же позицию.
      Разбирайте хвосты: сильно дороже рынка — теряете продажи,
      сильно дешевле — теряете маржу.
    cautions:
      - "Индекс считает Lamoda по своей методике из settings.get.
         Прочитайте настройки, прежде чем делать выводы из числа."
      - "Менять цены по итогам разбора — операции записи. Каждая из них
         требует confirm_write и ни одна не проверена живым вызовом:
         сначала dry_run."

  promo_effect:
    title: "Отдача от акций"
    question: "Что происходит с товарами в акциях?"
    steps:
      - method: v1.promotions.list
        purpose: "Действующие акции."
      - method: v1.promotions.finished
        purpose: "Завершённые акции — по ним есть итог."
      - method: v1.products.added
        purpose: "Товары, добавленные в акцию."
      - method: v1.products-added.total
        purpose: "Сколько всего товаров в акции."
    formula: |
      Сравните продажи позиции в период акции и в равный период до неё.
    cautions:
      - "Рост продаж в акции сам по себе ничего не доказывает: часть спроса
         просто сдвигается во времени. Смотрите и на период ПОСЛЕ акции —
         провал там означает, что вы продали со скидкой то, что купили бы и так."
      - "Считайте маржу, а не выручку."
