# Ручная курация каталога — ИСТОЧНИК ИСТИНЫ для safety.
#
# Зачем файл существует. Автоклассификация по имени метода — черновик, и ей
# нельзя доверять. У Lamoda все 155 методов приходят по POST (JSON-RPC), поэтому
# подстраховки «по HTTP-глаголу», которая ловила ошибки в marketplace-mcp, здесь
# нет вовсе. Единственная защита цен и остатков продавца — этот файл.
#
# Решения ниже приняты по описаниям операций из официальной спеки. Там, где
# описания нет (у Lamoda его нет у 77 из 155 методов), выбран более строгий
# уровень: неопределённость обязана ужесточать гейт, а не ослаблять.
#
# После правки пересоберите каталог:
#     python3 scripts/ingest_lamoda.py

safety:
  # --- исправления черновика по официальным описаниям ---------------------

  # «Возвращает файл со списком товаров для заданного продавца» — это чтение.
  # Черновик пометил write, потому что у имени нет узнаваемого суффикса.
  v1.matching-manager.price-index.products-list-export: read

  # «Проверка готовности заявки на формирование файла» — чтение статуса.
  v1.matching-manager.price-index.products-list-export.check: read

  # --- повышение уровня там, где черновик слишком мягок -------------------

  # Описания нет. Имя означает сброс состояния заказа — необратимое действие
  # над чужими деньгами. Черновик дал write; поднято до destructive, чтобы
  # требовалось второе подтверждение. Метод к тому же помечен спекой как
  # internal api, то есть не предназначен обычному продавцу.
  v1.order.reset: destructive

  # Описания нет, имя означает удаление товаров из акции. Черновик уже дал
  # destructive — фиксируем явно, чтобы правка эвристики не понизила уровень.
  v1.products.delete: destructive

  # --- намеренно строгие решения по ценовым методам -----------------------

  # Описания нет. Имя обещает расчёт (то есть чтение), НО спека Lamoda уже
  # доказала ненадёжность именно на ценовых методах: у пути
  # '/v1/nomenclature.validate-price' поле method закреплено enum-ом как
  # 'v1.nomenclature.set-price', то есть «проверить» и «установить» в спеке
  # перепутаны. Пока это не проверено живым вызовом, любой ценовой метод без
  # явного описания-геттера считается пишущим.
  v1.nomenclature.auto-conversion-price.calculate: write

  # Тот же случай: путь говорит «проверить цену», enum спеки требует
  # method 'set-price'. Оставляем write независимо от того, что означает имя.
  v1.nomenclature.validate-price: write

  # --- операции с токеном --------------------------------------------------
  # Клиент получает и обновляет токен сам. Ручной вызов этих методов агентом не
  # нужен и способен сбить кэш токена, поэтому они помечены как пишущие и
  # спрятаны из обычной выдачи (см. раздел internal ниже).
  v1.tokens.create: write
  v1.tokens.update: write

# Методы, скрытые из обычного поиска и списков. Показываются только при
# include_internal=true. Спека помечает 10 методов тегом "internal api";
# сюда добавлены операции с токеном, которыми управляет сам клиент.
internal:
  - v1.tokens.create
  - v1.tokens.update

# Русские описания для методов, у которых в спеке описания нет вовсе.
# Формулировки выведены из имени метода и соседних операций того же раздела —
# это подсказка для поиска, а не документация Lamoda.
